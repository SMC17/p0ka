[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p0ka"
version = "0.1.0"
description = "Variant-aware poker research primitives and tournament-agent foundation"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["p0ka*"]
